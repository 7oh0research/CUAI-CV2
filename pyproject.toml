[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vlmeval"
version = "0.1.0"
description = "Diagnosing and re-designing efficiency metrics for visual-token compression in VLMs (LLaVA-1.5)"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "pyyaml",
  "matplotlib",
  "tabulate",
]

[project.optional-dependencies]
# GPU inference stack (needed for `scripts/run_experiment.py` and `scripts/profile_efficiency.py`; efficiency engine tested on transformers 5.24)
infer = [
  "torch",
  "transformers>=4.50",
  "accelerate",
  "datasets",
  "pillow",
  "tqdm",
]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
