# CPU smoke test for the H1 pipeline with a tiny random-weight LLaVA (16 visual tokens, 12 layers).
# Latencies are meaningless here; this only checks that profiling -> records -> analysis runs end to end.
methods: [random, avgpool, downsample, cls_attn, divprune, visionzip, vscan, fastv, dart, pdrop_tiny, sparse_tiny]
budgets: [8, 4]
batch_sizes: [1, 2]
attn_impls: [sdpa, eager, flash]
grids:
  - {name: full}
  - {name: b4_only, budgets: [4], batch_sizes: [1], methods: [fastv, sparse_tiny]}
passes:
  - {max_new: 1, warmup: 1, repeats: 4}
  - {max_new: 8, warmup: 1, repeats: 3}
memory_lengths: [1, 8]
shuffle_seed: 0
seed: 0
tiny_layers: 12

custom_methods:
  pdrop_tiny:   {kind: inllm, scorer: last, stages: [{layer: 2, keep: 2.0}, {layer: 5, keep: 1.0}, {layer: 8, keep: 0.5}]}
  sparse_tiny:  {kind: inllm, scorer: text, stages: [{layer: 1, keep: 1.5}, {layer: 4, keep: 1.0}]}

output_dir: outputs/h1_tiny
