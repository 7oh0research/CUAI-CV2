# H1 (theoretical vs measured efficiency) -- full run on the rented RTX 5090 (32GB). fp16, never quantized.
# Protocol, hypotheses and thresholds: docs/h1_protocol.md.  Count configs / GPU hours first:
#   python scripts/plan_h1.py --config configs/h1.yaml
model:
  family: llava            # llava | llava_next | qwen2_vl | qwen2_5_vl
  name: llava-hf/llava-1.5-7b-hf
  dtype: float16

# `none` (576 tokens) is always added once per (backend, batch). Built-ins are minimal re-implementations
# (src/vlmeval/efficiency/methods.py), NOT the official code of FastV / SparseVLM / PyramidDrop.
methods: [random, avgpool, downsample, cls_attn, fastv, pdrop, sparsevlm_lite, visionzip, vscan, divprune, dart]

# Retained visual tokens (out of 576). In-LLM methods: stage keep = multiplier * budget.
budgets: [192, 128, 64, 32]
batch_sizes: [1, 4, 16, 32]    # vanilla is expected to OOM at 32 (KV ~17GB + 14GB weights): recorded as `oom`
# eager = materialised attention map; sdpa = torch default dispatch (usually the flash kernel);
# flash = torch's FlashAttention kernel *forced* (raises -> recorded `unsupported`, never a silent fallback);
# fa2 = the flash-attn package (optional; add it once `--preflight` shows it imports on sm_120).
attn_impls: [eager, sdpa, flash]

# Fractional design (each grid overrides the top-level defaults; duplicates are removed).
#  A: every method x {192, 64} x every backend x every batch size  -> the batch x backend x length core
#  B: the other budgets {128, 32} at sdpa only, bs {1, 16}         -> budget axis
grids:
  - {name: A_core, budgets: [192, 64]}
  - {name: B_budget, budgets: [128, 32], attn_impls: [sdpa], batch_sizes: [1, 16]}

# Output lengths L = 1 / 32 / 128 / 512 are all derived from the 512-token pass (fixed length, EOS ignored).
passes:
  - {name: prefill, max_new: 1,   warmup: 10, repeats: 50}   # tight CI on the prefill phase
  - {name: decode,  max_new: 512, warmup: 3,  repeats: 10}   # decode phase / e2e at L <= 512
memory_lengths: [1, 32, 128, 512]   # peak memory depends on L (KV preallocation) -> separate runs per L

shuffle_seed: 0     # random config order decouples method from GPU temperature / clock drift
seed: 0
question: "Describe the image in detail."

# Optional: define extra methods / override schedules.
# custom_methods:
#   fastv_k8: {kind: inllm, scorer: last, stages: [{layer: 7, keep: 1.0}]}

output_dir: outputs/h1
