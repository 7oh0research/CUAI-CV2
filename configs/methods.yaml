# 방법별 설정. *_keys 항목은 각 공식 저장소의 LLaVA-1.5-7B 스크립트 기준.
# step2 smoke test에서 실제 남은 토큰 수로 검증한다. 다르면 이 파일만 고친다.
model_path: liuhaotian/llava-v1.5-7b
methods:
  baseline:   {env: h1_llava,      repo: https://github.com/haotian-liu/LLaVA}
  fastv:      {env: h1_fastv,      repo: https://github.com/pkunlp-icler/FastV, K: 2}
  pdrop:      {env: h1_pdrop,      repo: https://github.com/Cooperx521/PyramidDrop, layer_list: [8, 16, 24]}
  sparsevlm:  {env: h1_sparsevlm,  repo: https://github.com/Gumpest/SparseVLMs}
  visionzip:  {env: h1_visionzip,  repo: https://github.com/dvlab-research/VisionZip, dominant_ratio: 0.84375}
  divprune:   {env: h1_divprune,   repo: https://github.com/vbdi/divprune}
  cdpruner:   {env: h1_cdpruner,   repo: https://github.com/Theia-4869/CDPruner}
  anchorprune: {env: h1_anchorprune, repo: "${ANCHORPRUNE_PATH}"}
grid:
  R: [32, 64, 128, 192]
  attn: [eager, sdpa, flash_attention_2]
  bs: [1, 4, 8, 16]
  reps: 3
  n_samples: 200
  warmup: 10
  new_tokens: 128
