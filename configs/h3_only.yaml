# H3: visual-dependence illusion. H1 is covered by prior-work analysis, not rerun here.
model_path: liuhaotian/llava-v1.5-7b
attention: sdpa
methods:
  baseline: {env: h1_llava, R: 576}
  fastv: {env: h1_fastv, R: 64}
  sparsevlm: {env: h1_sparsevlm, R: 64}
  visionzip: {env: h1_visionzip, R: 64}
experiment:
  max_new_tokens: 16
  batch_size: 1
  seed: 42
  # 0 means use every available item. Keep full benchmark by default.
  max_mme_items: 0
  max_pope_items: 0
  prompt_suffix: " Answer the question using a single word or short phrase."
